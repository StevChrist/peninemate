services:
  postgres:
    image: postgres:15-alpine
    container_name: peninemate_postgres
    environment:
      POSTGRES_DB: peninemate_db
      POSTGRES_USER: peninemate_user
      POSTGRES_PASSWORD: peninemate_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - peninemate_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peninemate_user -d peninemate_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peninemate_backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - peninemate_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://peninemate.stevchrist.site
    container_name: peninemate_frontend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://peninemate.stevchrist.site
    depends_on:
      - backend
    networks:
      - peninemate_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  peninemate_network:
    driver: bridge

volumes:
  postgres_data:
